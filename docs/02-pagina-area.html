<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Wireframe — Pagina area</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f1efe8; margin: 0; padding: 32px 16px; display: flex; justify-content: center; }
  .frame { width: 360px; background: #ffffff; border: 1px solid #e2e0da; border-radius: 16px; overflow: hidden; }
  .ph { background: #f1efe8; border-radius: 3px; }
  .note { font-size: 10px; color: #888780; margin: 0; }
  .chip { font-size: 9px; border: 1px solid #e2e0da; border-radius: 10px; padding: 2px 8px; color: #5f5e5a; }
  .badge { font-size: 9px; background: #f1efe8; border: 1px solid #b4b2a9; border-radius: 8px; padding: 2px 6px; color: #5f5e5a; }
</style>
</head>
<body>
<div class="frame">

  <div style="display:flex; align-items:center; gap:6px; padding: 12px 16px; border-bottom: 1px solid #e2e0da; font-size:11px; color:#888780;">
    <i class="ti ti-chevron-left" style="font-size:14px;"></i>
    <span>Home</span><span>/</span><span>Ormoni &amp; Ciclo</span>
  </div>

  <div style="padding: 20px 16px; border-bottom: 1px solid #e2e0da;">
    <p style="font-size:11px; color:#888780; margin:0 0 6px;">Trova il professionista giusto per:</p>
    <div class="ph" style="width:80%; height:16px;"></div>
  </div>

  <div style="padding: 16px; display:flex; flex-direction:column; gap:12px;">
    <div class="ph" style="width:60%; height:10px;"></div>

    <div style="border:1px solid #b4b2a9; border-radius:12px; padding:12px; position:relative;">
      <div class="badge" style="position:absolute; top:10px; right:10px;">Founder</div>
      <div style="display:flex; gap:10px;">
        <div style="width:48px; height:48px; border-radius:50%; border:1px dashed #b4b2a9; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:8px; color:#888780;">foto</div>
        <div style="flex:1;">
          <div class="ph" style="width:60%; height:9px; margin-bottom:6px;"></div>
          <div style="display:flex; gap:5px; flex-wrap:wrap;">
            <span class="chip">ciclo irregolare</span>
            <span class="chip">SPM</span>
          </div>
        </div>
      </div>
    </div>

    <div style="border:1px solid #e2e0da; border-radius:12px; padding:12px;">
      <div style="display:flex; gap:10px;">
        <div style="width:48px; height:48px; border-radius:50%; border:1px dashed #b4b2a9; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:8px; color:#888780;">foto</div>
        <div style="flex:1;">
          <div class="ph" style="width:55%; height:9px; margin-bottom:6px;"></div>
          <div style="display:flex; gap:5px; flex-wrap:wrap;">
            <span class="chip">ciclo irregolare</span>
          </div>
        </div>
      </div>
    </div>

    <div style="border:1px solid #e2e0da; border-radius:12px; padding:12px;">
      <div style="display:flex; gap:10px;">
        <div style="width:48px; height:48px; border-radius:50%; border:1px dashed #b4b2a9; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:8px; color:#888780;">foto</div>
        <div style="flex:1;">
          <div class="ph" style="width:65%; height:9px; margin-bottom:6px;"></div>
          <div style="display:flex; gap:5px; flex-wrap:wrap;">
            <span class="chip">SPM</span>
            <span class="chip">endometriosi</span>
          </div>
        </div>
      </div>
    </div>

    <p class="note">ordinamento: Founder sempre primi, poi rilevanza. Chip cliccabili -&gt; altra pagina area</p>
  </div>

</div>
</body>
</html>
