<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Wireframe — Chi siamo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f1efe8; margin: 0; padding: 32px 16px; display: flex; justify-content: center; }
  .frame { width: 360px; background: #ffffff; border: 1px solid #e2e0da; border-radius: 16px; overflow: hidden; }
  .ph { background: #f1efe8; border-radius: 3px; }
  .badge { font-size: 8px; border: 1px solid #b4b2a9; border-radius: 8px; padding: 2px 6px; color: #5f5e5a; flex-shrink:0; }
</style>
</head>
<body>
<div class="frame">

  <div style="display:flex; align-items:center; justify-content:space-between; padding: 12px 16px; border-bottom: 1px solid #e2e0da;">
    <div style="width:100px; height:16px; background:#f1efe8; border:1px dashed #b4b2a9; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:10px; color:#888780;">logo</div>
    <i class="ti ti-menu-2" style="font-size:20px; color:#5f5e5a;"></i>
  </div>

  <div style="padding: 20px 16px; border-bottom: 1px solid #e2e0da; text-align:center;">
    <div style="width:96px; height:96px; border-radius:50%; border:1px dashed #b4b2a9; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; font-size:9px; color:#888780;">foto</div>
    <div class="ph" style="width:60%; height:12px; margin:0 auto 10px;"></div>
    <div class="ph" style="width:100%; height:6px; margin-bottom:3px;"></div>
    <div class="ph" style="width:100%; height:6px; margin-bottom:3px;"></div>
    <div class="ph" style="width:80%; height:6px; margin:0 auto;"></div>
  </div>

  <div style="padding: 16px;">
    <div class="ph" style="width:50%; height:11px; margin-bottom:4px;"></div>
    <div class="ph" style="width:90%; height:6px; margin-bottom:14px;"></div>

    <div style="display:flex; flex-direction:column; gap:10px;">
      <div style="border:1px solid #b4b2a9; border-radius:12px; padding:10px; display:flex; gap:10px; align-items:center;">
        <div style="width:44px; height:44px; border-radius:50%; border:1px dashed #b4b2a9; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:8px; color:#888780;">foto</div>
        <div style="flex:1;">
          <div class="ph" style="width:60%; height:8px; margin-bottom:5px;"></div>
          <div class="ph" style="width:90%; height:5px;"></div>
        </div>
        <span class="badge">Founder</span>
      </div>
      <div style="border:1px solid #b4b2a9; border-radius:12px; padding:10px; display:flex; gap:10px; align-items:center;">
        <div style="width:44px; height:44px; border-radius:50%; border:1px dashed #b4b2a9; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:8px; color:#888780;">foto</div>
        <div style="flex:1;">
          <div class="ph" style="width:55%; height:8px; margin-bottom:5px;"></div>
          <div class="ph" style="width:85%; height:5px;"></div>
        </div>
        <span class="badge">Founder</span>
      </div>
      <div style="border:1px solid #b4b2a9; border-radius:12px; padding:10px; display:flex; gap:10px; align-items:center;">
        <div style="width:44px; height:44px; border-radius:50%; border:1px dashed #b4b2a9; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:8px; color:#888780;">foto</div>
        <div style="flex:1;">
          <div class="ph" style="width:65%; height:8px; margin-bottom:5px;"></div>
          <div class="ph" style="width:80%; height:5px;"></div>
        </div>
        <span class="badge">Founder</span>
      </div>
    </div>
  </div>

  <div style="padding: 16px; border-top:1px solid #e2e0da; display:flex; gap:14px; font-size:10px; color:#888780;">
    <span>Privacy Policy</span><span>Termini di utilizzo</span>
  </div>

</div>
</body>
</html>
