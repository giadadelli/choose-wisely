<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Wireframe — Profilo professionista</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f1efe8; margin: 0; padding: 32px 16px; display: flex; justify-content: center; }
  .frame { width: 360px; background: #ffffff; border: 1px solid #e2e0da; border-radius: 16px; overflow: hidden; }
  .ph { background: #f1efe8; border-radius: 3px; }
  .caption { font-size: 10px; color: #888780; text-transform: uppercase; letter-spacing: .03em; margin: 0 0 6px; }
  .chip { font-size: 10px; border: 1px solid #e2e0da; border-radius: 12px; padding: 4px 10px; color: #5f5e5a; }
  .contact { display:flex; align-items:center; gap:10px; height:40px; border:1px solid #b4b2a9; border-radius: 8px; padding:0 12px; }
</style>
</head>
<body>
<div class="frame">

  <div style="display:flex; align-items:center; gap:6px; padding: 12px 16px; border-bottom: 1px solid #e2e0da; font-size:11px; color:#888780;">
    <i class="ti ti-chevron-left" style="font-size:14px;"></i>
    <span>Ormoni &amp; Ciclo</span><span>/</span><span>Dr.ssa —</span>
  </div>

  <div style="padding: 20px 16px; border-bottom: 1px solid #e2e0da; text-align:center;">
    <div style="width:88px; height:88px; border-radius:50%; border:1px dashed #b4b2a9; margin:0 auto 10px; display:flex; align-items:center; justify-content:center; font-size:9px; color:#888780;">foto</div>
    <div class="ph" style="width:150px; height:12px; margin:0 auto 8px;"></div>
    <span style="font-size:10px; border:1px solid #b4b2a9; border-radius: 8px; padding:3px 10px; color:#5f5e5a;">Founder</span>
  </div>

  <div style="padding: 16px; border-bottom: 1px solid #e2e0da;">
    <p class="caption">bio</p>
    <div class="ph" style="width:100%; height:6px; margin-bottom:3px;"></div>
    <div class="ph" style="width:100%; height:6px; margin-bottom:3px;"></div>
    <div class="ph" style="width:60%; height:6px;"></div>
  </div>

  <div style="padding: 16px; border-bottom: 1px solid #e2e0da;">
    <p class="caption">specializzazioni</p>
    <div style="display:flex; gap:6px; flex-wrap:wrap;">
      <span class="chip">ciclo irregolare</span>
      <span class="chip">SPM</span>
      <span class="chip">endometriosi</span>
    </div>
  </div>

  <div style="padding: 16px; display:flex; flex-direction:column; gap:8px;">
    <p class="caption" style="margin-bottom:2px;">contatti diretti</p>
    <div class="contact">
      <i class="ti ti-phone" style="font-size:16px; color:#5f5e5a;"></i>
      <span style="font-size:12px; color:#5f5e5a;">tel: chiama ora</span>
    </div>
    <div class="contact">
      <i class="ti ti-mail" style="font-size:16px; color:#5f5e5a;"></i>
      <span style="font-size:12px; color:#5f5e5a;">mailto: scrivi una email</span>
    </div>
    <div class="contact">
      <i class="ti ti-external-link" style="font-size:16px; color:#5f5e5a;"></i>
      <span style="font-size:12px; color:#5f5e5a;">sito esterno</span>
    </div>
    <div style="display:flex; gap:14px; padding-top:4px;">
      <i class="ti ti-brand-instagram" style="font-size:16px; color:#888780;"></i>
      <i class="ti ti-brand-facebook" style="font-size:16px; color:#888780;"></i>
      <i class="ti ti-brand-linkedin" style="font-size:16px; color:#888780;"></i>
    </div>
    <p style="font-size:10px; color:#888780; margin:6px 0 0;">nessun form in-app, nessun gate di registrazione: Diana esce dalla piattaforma</p>
  </div>

</div>
</body>
</html>
