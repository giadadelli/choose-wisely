<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Wireframe — Homepage</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f1efe8; margin: 0; padding: 32px 16px; display: flex; justify-content: center; }
  .frame { width: 360px; background: #ffffff; border: 1px solid #e2e0da; border-radius: 16px; overflow: hidden; }
  .ph { background: #f1efe8; border-radius: 3px; }
  .caption { font-size: 10px; color: #888780; text-transform: uppercase; letter-spacing: .03em; margin: 0 0 4px; }
  .note { font-size: 11px; color: #888780; margin: 8px 0 0; }
  .chip { font-size: 9px; border: 1px solid #e2e0da; border-radius: 10px; padding: 2px 8px; color: #5f5e5a; }
</style>
</head>
<body>
<div class="frame">

  <div style="display:flex; align-items:center; justify-content:space-between; padding: 12px 16px; border-bottom: 1px solid #e2e0da;">

          <div class="ph" style="width:80%; height:8px; margin-bottom:5px;"></div>
          <div class="ph" style="width:60%; height:6px;"></div>

      </div>
    </div>
  </div>

  <div style="padding: 16px; border-top:1px solid #e2e0da; display:flex; gap:12px; align-items:center;">
    <div style="width:64px; height:64px; flex-shrink:0; border:1px dashed #b4b2a9; border-radius: 8px; display:flex; align-items:center; justify-content:center; font-size:9px; color:#888780;">img</div>

      <div class="ph" style="width:70%; height:9px; margin-bottom:6px;"></div>
      <div class="ph" style="width:100%; height:6px; margin-bottom:4px;"></div>
      <div class="ph" style="width:40%; height:6px;"></div>
    </div>
  </div>

    <div class="ph" style="width:80px; height:12px;"></div>
    <div style="display:flex; gap:10px;">
      <i class="ti ti-brand-instagram" style="font-size:16px; color:#888780;"></i>
      <i class="ti ti-brand-facebook" style="font-size:16px; color:#888780;"></i>
      <i class="ti ti-brand-x" style="font-size:16px; color:#888780;"></i>

</html>
