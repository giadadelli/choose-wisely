<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Wireframe — Sei un professionista</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f1efe8; margin: 0; padding: 32px 16px; display: flex; justify-content: center; }
  .frame { width: 360px; background: #ffffff; border: 1px solid #e2e0da; border-radius: 16px; overflow: hidden; }
  .ph { background: #f1efe8; border-radius: 3px; }
  label { font-size:11px; color:#5f5e5a; display:block; margin-bottom:4px; }
  input[type=text] { width:100%; height:36px; border:1px solid #b4b2a9; border-radius:8px; padding:0 10px; margin-bottom:12px; background:#ffffff; color:#b4b2a9; font-size:12px; }
  button { width:100%; height:40px; border:1px solid #b4b2a9; border-radius:8px; background:#ffffff; color:#2c2c2a; font-size:13px; }
</style>
</head>
<body>
<div class="frame">

  <div style="display:flex; align-items:center; justify-content:space-between; padding: 12px 16px; border-bottom: 1px solid #e2e0da;">
    <div style="width:100px; height:16px; background:#f1efe8; border:1px dashed #b4b2a9; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:10px; color:#888780;">logo</div>
    <i class="ti ti-menu-2" style="font-size:20px; color:#5f5e5a;"></i>
  </div>

  <div style="padding: 20px 16px; border-bottom: 1px solid #e2e0da;">
    <div class="ph" style="width:70%; height:13px; margin-bottom:10px;"></div>
    <div class="ph" style="width:100%; height:6px; margin-bottom:3px;"></div>
    <div class="ph" style="width:100%; height:6px; margin-bottom:3px;"></div>
    <div class="ph" style="width:75%; height:6px;"></div>
  </div>

  <div style="padding: 16px;">
    <div class="ph" style="width:55%; height:10px; margin-bottom:12px;"></div>

    <label>nome e cognome</label>
    <input type="text" value="Mario Rossi" readonly>

    <label>email</label>
    <input type="text" value="nome@esempio.it" readonly>

    <label>messaggio</label>
    <div style="width:100%; height:56px; border:1px solid #b4b2a9; border-radius: 8px; margin-bottom:14px;"></div>

    <button>invia richiesta</button>

    <p style="font-size:10px; color:#888780; margin:10px 0 0; text-align:center;">oppure scrivi direttamente a
      <span style="color:#5f5e5a;">mailto: info@choosewisely.it</span>
    </p>
    <p style="font-size:10px; color:#888780; margin:6px 0 0;">nessuna registrazione: è solo un punto di contatto, il team valuta manualmente</p>
  </div>

  <div style="padding: 16px; border-top:1px solid #e2e0da; display:flex; gap:14px; font-size:10px; color:#888780;">
    <span>Privacy Policy</span><span>Termini di utilizzo</span>
  </div>

</div>
</body>
</html>
